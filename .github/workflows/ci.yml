name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --test test/*.test.cjs
      - run: node scripts/build-workflow.cjs --check
  observe:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/merge.yml
    with:
      pull-number: ${{ format('{0}', github.event.pull_request.number) }}
      expected-head: ${{ github.event.pull_request.head.sha }}
      required-checks: '[{"name":"verify","appId":15368}]'
      dry-run: true
